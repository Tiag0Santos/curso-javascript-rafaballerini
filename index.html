<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Lista de Tarefas</h1>
    <p>Adicione suas tarefas!</p>
    <input type="text" id="inputTarefa" placeholder="Digite a sua tarefa">
    <button onclick="adicionarTarefa()" class="button-adicionar">Adicionar Tarefa</button>
    <button onclick="limparLista()" id="botaoLimparLista" class="botao_lista oculto">Excluir Tudo</button>
    <p id="mensagem"></p>
    <div class="paginas">
        <button id="todas" class="button-paginas">Todas</button>
        <button id="pendentes" class="button-paginas">Pendentes</button>
        <button id="concluidas" class="button-paginas">Concluídas</button>
    </div>
        <hr>         
    <ul id="listaTarefas"></ul>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2>Editar Tarefa</h2>
      <input type="text" id="inputEditar">
        <div class="modal-botoes">
          <button onclick="fecharModal()"
          id="cancelar" class="btn-cancelar-edicao">Cancelar</button>
          <button onclick="salvarEdicao()"
          id="salvar" class="btn-salvar-edicao">Salvar</button>
        </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
